<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="common.css">
<style>
  body { position: relative; overflow: hidden; }
  svg.bg { position: absolute; inset: 0; width: 100%; height: 100%; }
  .safe { position: absolute; left: 50%; top: 50%; width: var(--sw); height: var(--sh);
          transform: translate(-50%, -50%); display: flex; align-items: center; justify-content: center; gap: calc(var(--u) * 52px); }
  .coin { height: calc(var(--u) * 330px); aspect-ratio: 1; filter: drop-shadow(0 calc(var(--u) * 18px) calc(var(--u) * 40px) rgba(0,0,0,.45)); }
  .words { display: grid; gap: calc(var(--u) * 18px); color: #F5F7F6; }
  h1 { font-weight: 900; font-size: calc(var(--u) * 150px); letter-spacing: -0.03em; word-spacing: .08em; line-height: .92; }
  p { font-family: "Inter", sans-serif; font-weight: 500; font-size: calc(var(--u) * 50px); color: #B9CCC3; letter-spacing: -0.01em; }
  .pill { justify-self: start; font-family: "Inter", sans-serif; font-weight: 700; font-size: calc(var(--u) * 34px);
          color: #06140F; background: #2BD38F; padding: calc(var(--u) * 12px) calc(var(--u) * 28px); border-radius: 999px; }
</style></head>
<body class="ink">
  <svg class="bg" viewBox="0 0 2560 1440" preserveAspectRatio="xMidYMid slice">
    <defs>
      <linearGradient id="area" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#2BD38F" stop-opacity=".22"/><stop offset="1" stop-color="#2BD38F" stop-opacity="0"/>
      </linearGradient>
      <pattern id="grid" width="80" height="80" patternUnits="userSpaceOnUse">
        <path d="M80 0H0V80" fill="none" stroke="#FFFFFF" stroke-opacity=".045" stroke-width="2"/>
      </pattern>
    </defs>
    <rect width="2560" height="1440" fill="url(#grid)"/>
    <path d="M0 1250 C 260 1230, 420 1180, 640 1150 S 1000 1120, 1200 1040 S 1560 980, 1780 860 S 2200 640, 2560 420 V1440 H0 Z" fill="url(#area)"/>
    <path d="M0 1250 C 260 1230, 420 1180, 640 1150 S 1000 1120, 1200 1040 S 1560 980, 1780 860 S 2200 640, 2560 420" fill="none" stroke="#2BD38F" stroke-opacity=".55" stroke-width="6"/>
    <g fill="#2BD38F" fill-opacity=".7"><circle cx="640" cy="1150" r="10"/><circle cx="1200" cy="1040" r="10"/><circle cx="1780" cy="860" r="10"/><circle cx="2560" cy="420" r="10"/></g>
  </svg>
  <div class="safe" id="safe">
    <img class="coin" src="coin.svg" alt="">
    <div class="words" id="words">
      <h1>Nickel Notes</h1>
      <p>Money, explained in 80 seconds.</p>
      <span class="pill">New note every day</span>
    </div>
  </div>
</body></html>
