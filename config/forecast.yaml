# The dashboard's Prediction card: how long until each platform's payout program unlocks
# and until total ad earnings pass each milestone. `python -m pipeline metrics collect`
# projects each platform's daily views and follower gain forward (pipeline/forecast.py).
#
# Pace is read from Metricool's daily series (the `daily` lists in the stats file). Until a
# platform has `min_days` days with views, it borrows the average pace of the platforms that
# have them ("proxy"). Until `growth_days` days, weekly growth is `growth.assumed`.
# Growth slows as the channel matures (halves every `half_life_days`).
horizon_days: 1095            # beyond this the card says "over 3 years"
window_days: 14               # recent days the current pace is averaged over
min_days: 2
growth_days: 14
growth:
  assumed: 0.15               # weekly growth in daily views; typical for a new channel posting daily
  min: -0.10
  max: 0.40
  half_life_days: 240
# Scenarios: the range shown next to each date. Growth is offset, RPM is picked per scenario.
scenarios:
  cautious: {growth: -0.07, rpm: 0}
  expected: {growth: 0.0, rpm: 1}
  strong:   {growth: 0.10, rpm: 2}
# New followers per 1,000 views, until a platform has gained `min_followers` to measure from.
followers_per_1k: {youtube: 2.0, instagram: 1.5, facebook: 1.0, twitter: 0.5}
min_followers: 20
milestones_usd: [100, 1000, 10000, 100000]

# Programs that pay. rpm_usd = creator earnings per 1,000 views [cautious, expected, strong]
# (research/monetization-2026.md: Shorts $0.01-0.07 general and $0.10-0.35 finance/tech;
# Facebook Reels ~$1-10 per 1k, unverified, so kept low). Instagram Gifts pay too little to
# project. `from` applies stricter rules on that date (YouTube, 1 Feb 2027).
programs:
  youtube:
    name: YouTube Partner Program
    followers: 1000
    views: 10000000
    window_days: 90
    rpm_usd: [0.03, 0.06, 0.12]
    review_days: 30           # application review before the first paid view, roughly
    from: {"2027-02-01": {views: 20000000}}
  facebook:
    name: Facebook Content Monetization
    followers: 5000
    minutes: 600000           # watch minutes in the window
    minutes_per_view: 0.15    # ~9 s average watch per Reel view (the channel's own Reels so far)
    window_days: 60
    rpm_usd: [0.3, 1.0, 2.0]
    review_days: 14
  instagram:
    name: Instagram Gifts
    followers: 500
    window_days: 30
    rpm_usd: [0, 0, 0]
