<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Yield acts</title>
<style>
  html, body { margin: 0; background: #f6f4fa; overflow: hidden; }
  #stage { position: absolute; inset: 0; }
  #stage canvas { display: block; }
</style>
<script type="importmap">
{ "imports": { "three": "/node_modules/three/build/three.module.js", "three/addons/": "/node_modules/three/examples/jsm/" } }
</script>
</head>
<body>
<div id="stage"></div>
<script type="module">
// Text-free clay clips for the "mortgage rates past 7%" Short (?act=1..4). The assembler adds
// captions and the overlays ("10-YR TREASURY YIELD", "HIGHEST SINCE 2002", "~$280 A MONTH",
// "YIELD UP, RATES UP") on top.
//   1  (5.0 s) a green yield line climbs inside a dark panel
//   2  (5.4 s) the long view: the line falls from the dashed 2002 level, climbs back and crosses it
//   3  (6.4 s) coins fall in through the open top of an empty glass jar, then two stacks compared
//   4  (5.0 s) two tethered hot-air balloons: the first rises, the rope goes taut, the second follows
import * as THREE from "three";
import { makeRenderer, ready, span, clamp, lerp, easeOutBack, easeInOutCubic, rng, params, studioEnvironment, cameraRig,
  clay, studio, glow } from "./kit.js";

const ACT = Number(params.get("act") || 1);
const DUR = { 1: 5.0, 2: 5.4, 3: 6.4, 4: 5.0 }[ACT];

const { renderer, scene, camera, draw } = makeRenderer({
  tone: "neutral", msaa: 4, shadows: "vsm", fov: 36,
  bloom: { strength: 0.45, radius: 0.35, threshold: 1.15 },
  finish: { grain: 0.03, vignette: 0.18, aberration: 0.0012 },
});
renderer.toneMappingExposure = 0.92;
studioEnvironment(renderer, scene, 0.35);
const sky = ACT === 4;
studio(scene, sky ? { top: 0xa9d4f5, bottom: 0xf7efe6, dots: 0xc9c3dc } : {});
scene.add(new THREE.HemisphereLight(0xffffff, 0xd9d2ea, 0.55));
const key = new THREE.DirectionalLight(0xfff1e0, 1.9);
key.position.set(5, 10, 7);
key.castShadow = true;
key.shadow.mapSize.set(1024, 1024);
key.shadow.radius = 7;
key.shadow.blurSamples = 10;
Object.assign(key.shadow.camera, { left: -9, right: 9, top: 12, bottom: -9, near: 1, far: 40 });
key.shadow.bias = -0.0005;
scene.add(key);
const fill = new THREE.DirectionalLight(0xcfe0ff, 0.6);
fill.position.set(-7, 4, 3);
scene.add(fill);

const GOLD = new THREE.Color(0xd99a2b), CORAL = new THREE.Color(0xf0473c), MINT = new THREE.Color(0x2fa37a);
const GREEN_HOT = new THREE.Color(0x3dff8f).multiplyScalar(1.35);
const shadowed = (m) => { m.castShadow = m.receiveShadow = true; return m; };

// ---------- the dark panel and its yield line (acts 1 and 2) ------------------------------
// Real shape of the 10-year yield, as (x 0..1, y in %): act 1 the recent climb,
// act 2 from the 2002 level down to the 2020 low and back up through it.
const RECENT = [[0, 0.7], [0.08, 0.9], [0.17, 1.6], [0.26, 1.4], [0.34, 1.8], [0.43, 2.9], [0.5, 3.1], [0.56, 2.8],
  [0.62, 4.0], [0.68, 3.6], [0.74, 3.5], [0.8, 3.9], [0.86, 4.3], [0.92, 4.6], [1.0, 5.0]];
const LONG = [[0, 5.0], [0.05, 4.1], [0.1, 4.3], [0.17, 4.7], [0.22, 3.8], [0.27, 2.4], [0.33, 3.6], [0.38, 3.2],
  [0.44, 1.9], [0.5, 1.7], [0.55, 2.5], [0.6, 1.6], [0.64, 2.9], [0.69, 1.8], [0.73, 0.6], [0.78, 1.5], [0.83, 3.1],
  [0.87, 4.2], [0.9, 3.6], [0.94, 4.7], [1.0, 5.45]];
const LEVEL_2002 = 5.0;

let lineMesh = null, head = null, dashes = [], panel = null;
const PW = 3.4, PH = 4.6, PY = 2.6;           // panel width, height, centre height
if (ACT <= 2) {
  panel = new THREE.Group();
  const box = shadowed(new THREE.Mesh(new THREE.BoxGeometry(PW + 0.36, PH + 0.36, 0.28), clay(0x1b2140, { rimStrength: 0.18, roughness: 0.5 })));
  panel.add(box);
  const face = new THREE.Mesh(new THREE.PlaneGeometry(PW, PH), new THREE.MeshBasicMaterial({ color: 0x0b1024 }));
  face.position.z = 0.142;
  panel.add(face);
  // faint grid
  const gridMat = new THREE.MeshBasicMaterial({ color: 0x24305a });
  for (let i = 1; i < 6; i++) {
    const h = new THREE.Mesh(new THREE.PlaneGeometry(PW - 0.2, 0.012), gridMat);
    h.position.set(0, -PH / 2 + (i * PH) / 6, 0.145); panel.add(h);
  }
  for (let i = 1; i < 5; i++) {
    const v = new THREE.Mesh(new THREE.PlaneGeometry(0.012, PH - 0.2), gridMat);
    v.position.set(-PW / 2 + (i * PW) / 5, 0, 0.145); panel.add(v);
  }
  const stand = shadowed(new THREE.Mesh(new THREE.CylinderGeometry(0.12, 0.12, PY - PH / 2 - 0.1, 24), clay(0x2a3156)));
  stand.position.set(0, -(PH / 2) - (PY - PH / 2 - 0.1) / 2 - 0.1, -0.05);
  panel.add(stand);
  const foot = shadowed(new THREE.Mesh(new THREE.CylinderGeometry(0.9, 1.0, 0.1, 48), clay(0x2a3156)));
  foot.position.set(0, -PY + 0.05, -0.05);
  panel.add(foot);
  panel.position.set(0, PY, 0);
  scene.add(panel);

  const data = ACT === 1 ? RECENT : LONG;
  const yMax = 6.0;
  const toP = ([x, y]) => new THREE.Vector3(-PW / 2 + 0.25 + x * (PW - 0.5), -PH / 2 + 0.3 + (y / yMax) * (PH - 0.6), 0.17);
  const pts = data.map(toP);
  const curve = new THREE.CatmullRomCurve3(pts, false, "centripetal", 0.3);
  const SEG = 400;
  const tube = new THREE.TubeGeometry(curve, SEG, 0.04, 8, false);
  lineMesh = new THREE.Mesh(tube, new THREE.MeshBasicMaterial({ color: GREEN_HOT, toneMapped: false }));
  lineMesh.userData = { curve, perSeg: 8 * 6 };
  panel.add(lineMesh);
  head = glow(0x7dffb6, 0.32);
  panel.add(head);
  if (ACT === 2) {
    const y = toP([0, LEVEL_2002]).y;
    const dashMat = new THREE.MeshBasicMaterial({ color: new THREE.Color(0xffb35c).multiplyScalar(1.3), toneMapped: false, transparent: true });
    for (let x = -PW / 2 + 0.2; x < PW / 2 - 0.2; x += 0.22) {
      const d = new THREE.Mesh(new THREE.PlaneGeometry(0.12, 0.03), dashMat);
      d.position.set(x + 0.06, y, 0.16);
      panel.add(d); dashes.push(d);
    }
    lineMesh.userData.dashMat = dashMat;
  }
}

function actLine(t) {
  const { curve, perSeg } = lineMesh.userData;
  // act 1 draws over 0.2..4.2 s; act 2 over 0.3..4.3 s (dashes first)
  const k = ACT === 1 ? span(t, 0.2, 4.2, (x) => x) : span(t, 0.5, 4.3, (x) => x);
  const n = Math.max(1, Math.round(k * 400));
  lineMesh.geometry.setDrawRange(0, n * perSeg);
  const p = curve.getPointAt(clamp(n / 400, 0, 1));
  head.position.set(p.x, p.y, 0.2);
  head.material.uniforms.uOpacity.value = 0.75 + 0.25 * Math.sin(t * 7.0);
  let rig;
  if (ACT === 1) {
    rig = cameraRig([{ t: 0, pos: [0.6, 2.9, 12.6], look: [0, 2.55, 0] }, { t: DUR, pos: [-0.2, 3.0, 11.2], look: [0, 2.6, 0] }], { ease: easeInOutCubic, drift: 0.04 });
  } else {
    const dm = lineMesh.userData.dashMat;
    const cross = 4.05;              // where the line passes the dashed level
    dm.opacity = span(t, 0.0, 0.4) * (t > cross ? 0.75 + 0.25 * Math.sin((t - cross) * 9.0) : 1);
    dm.color.set(0xffb35c).multiplyScalar(t > cross ? 1.3 + 1.0 * span(t, cross, cross + 0.2) : 1.3);
    head.scale.setScalar(1 + 0.7 * span(t, cross, cross + 0.25) * (1 - span(t, cross + 0.6, cross + 1.2)));
    rig = cameraRig([{ t: 0, pos: [-3.2, 3.3, 11.6], look: [0, 2.6, 0] }, { t: DUR, pos: [-1.4, 3.1, 10.6], look: [0.2, 2.75, 0] }], { ease: easeInOutCubic, drift: 0.04 });
  }
  rig(camera, t);
}

// ---------- jar and two stacks (act 3) ------------------------------------------------------
const COIN_H = 0.058;
let coins3 = null, extra3 = null, extraMat3 = null, plates3 = [];
const JX = -2.6, JR = 0.62, JH = 1.9, CR = 0.42;
if (ACT === 3) {
  const glass = new THREE.MeshPhysicalMaterial({ color: 0xe8f3ff, roughness: 0.08, metalness: 0, transparent: true, opacity: 0.22,
    side: THREE.DoubleSide, depthWrite: false, clearcoat: 1, clearcoatRoughness: 0.1 });
  const wall = new THREE.Mesh(new THREE.CylinderGeometry(JR, JR, JH, 64, 1, true), glass);
  wall.position.set(JX, JH / 2 + 0.02, 0);
  wall.renderOrder = 2;
  scene.add(wall);
  const bottom = new THREE.Mesh(new THREE.CylinderGeometry(JR, JR, 0.06, 64), new THREE.MeshPhysicalMaterial({ color: 0xdfeefc,
    roughness: 0.1, transparent: true, opacity: 0.45 }));
  bottom.position.set(JX, 0.03, 0);
  bottom.receiveShadow = true;
  scene.add(bottom);
  const lip = new THREE.Mesh(new THREE.TorusGeometry(JR, 0.035, 12, 64), new THREE.MeshPhysicalMaterial({ color: 0xffffff,
    roughness: 0.15, transparent: true, opacity: 0.6 }));
  lip.rotation.x = Math.PI / 2;
  lip.position.set(JX, JH + 0.02, 0);
  scene.add(lip);
  const coinGeo = new THREE.CylinderGeometry(CR, CR, COIN_H * 0.92, 48);
  const plateGeo = new THREE.CylinderGeometry(0.72, 0.76, 0.08, 64);
  coins3 = shadowed(new THREE.InstancedMesh(coinGeo, clay(GOLD, { rimStrength: 0.12, roughness: 0.4 }), 140));
  extraMat3 = clay(GOLD.clone(), { rimStrength: 0.12, roughness: 0.4 });
  extraMat3.emissive = CORAL.clone();
  extra3 = shadowed(new THREE.InstancedMesh(coinGeo, extraMat3, 5));
  scene.add(coins3, extra3);
  const tone = rng(5), col = new THREE.Color();
  for (let i = 0; i < coins3.count; i++) coins3.setColorAt(i, col.setScalar(0.9 + tone() * 0.14));
  for (const x of [0.6, 2.2]) {
    const p = shadowed(new THREE.Mesh(plateGeo, clay(0xe4def2, { rimStrength: 0.1 })));
    p.position.set(x, 0.04, 0); scene.add(p); plates3.push(p);
  }
}
const jit = rng(11);
const J = Array.from({ length: 200 }, () => [(jit() - 0.5) * 0.04, (jit() - 0.5) * 0.04, jit() * 6.28, jit()]);
const M = new THREE.Matrix4(), Q = new THREE.Quaternion(), P = new THREE.Vector3(), S = new THREE.Vector3(1, 1, 1), UP = new THREE.Vector3(0, 1, 0);
const hide = (m, i) => m.setMatrixAt(i, M.makeScale(0.0001, 0.0001, 0.0001));
// A coin dropped from `y0` lands at its level at tLand (free fall, then a small settle).
function fall(m, i, x, z, base, level, tLand, t, j, y0) {
  const g = 9.0, tf = Math.sqrt((2 * (y0 - (base + COIN_H * (level + 0.5)))) / g);
  const t0 = tLand - tf;
  if (t < t0) return hide(m, i);
  const yRest = base + COIN_H * (level + 0.5);
  const y = t < tLand ? y0 - 0.5 * g * (t - t0) * (t - t0) : yRest + Math.max(0, Math.sin((t - tLand) * 18) * 0.015 * Math.exp(-(t - tLand) * 12));
  P.set(x + j[0], y, z + j[1]);
  Q.setFromAxisAngle(UP, j[2] + (t < tLand ? (t - t0) * 2.0 : tf * 2.0));
  m.setMatrixAt(i, M.compose(P, Q, S));
}
function coinRise(m, i, x, z, level, tLand, t, j) {
  const k = clamp((t - (tLand - 0.32)) / 0.32);
  if (k <= 0) return hide(m, i);
  P.set(x + j[0], 0.08 + COIN_H * (level + 0.5) + (1 - easeOutBack(k)) * 1.1, z + j[1]);
  Q.setFromAxisAngle(UP, j[2]);
  m.setMatrixAt(i, M.compose(P, Q, S));
}
function actJar(t) {
  for (let i = 0; i < coins3.count; i++) hide(coins3, i);
  for (let i = 0; i < 5; i++) hide(extra3, i);
  // 30 coins fall one by one through the open top and stack on the jar floor (0.15..2.1 s)
  for (let i = 0; i < 30; i++) fall(coins3, i, JX, 0, 0.06, i, 0.35 + i * 0.06, t, J[i], 3.6);
  // two stacks: 45 coins ($2,486) and 45 + 5 glowing ($2,770); they rise as the camera arrives
  const T2 = 2.2;
  for (let i = 0; i < 45; i++) coinRise(coins3, 30 + i, 0.6, 0, i, T2 + i * 0.022, t, J[(40 + i) % 200]);
  for (let i = 0; i < 45; i++) coinRise(coins3, 75 + i, 2.2, 0, i, T2 + 0.1 + i * 0.022, t, J[(90 + i) % 200]);
  for (let i = 0; i < 5; i++) coinRise(extra3, i, 2.2, 0, 45 + i, T2 + 0.1 + (45 + i) * 0.022 + 0.15, t, J[150 + i]);
  const hot = span(t, 3.6, 4.0);
  extraMat3.color.copy(GOLD).lerp(CORAL, hot);
  extraMat3.emissiveIntensity = hot * (0.6 + 0.2 * Math.sin(t * 6.0));
  coins3.instanceMatrix.needsUpdate = extra3.instanceMatrix.needsUpdate = true;
  cameraRig([
    { t: 0, pos: [JX + 0.2, 2.6, 5.4], look: [JX, 1.0, 0] },
    { t: 2.0, pos: [JX + 0.4, 2.4, 5.0], look: [JX, 0.9, 0] },
    { t: 3.1, pos: [1.4, 3.3, 10.2], look: [1.4, 1.45, 0] },
    { t: DUR, pos: [1.7, 3.2, 9.6], look: [1.45, 1.5, 0] },
  ], { drift: 0.04 })(camera, t);
}

// ---------- two tethered hot-air balloons (act 4) -------------------------------------------
let balloons = [], rope = null, ropeMat = null;
const L = 3.3;                       // rope length between baskets
function makeBalloon(color, stripe) {
  const g = new THREE.Group();
  const prof = [];
  for (let i = 0; i <= 24; i++) {
    const a = (i / 24) * Math.PI;                 // bottom (0) to top (PI)
    const r = Math.sin(a) * (0.95 + 0.12 * Math.sin(a)) * (a < 1.0 ? 0.55 + 0.45 * (a / 1.0) : 1);
    prof.push(new THREE.Vector2(Math.max(0.12, r), -Math.cos(a) * 1.2));
  }
  const env = shadowed(new THREE.Mesh(new THREE.LatheGeometry(prof, 48), clay(color, { rimStrength: 0.2 })));
  env.position.y = 2.2;
  g.add(env);
  for (let k = 0; k < 4; k++) {        // four gores in a second colour
    const gore = shadowed(new THREE.Mesh(new THREE.LatheGeometry(prof.map((p) => p.clone().multiplyScalar(1.004)), 6, k * Math.PI / 2, 0.22),
      clay(stripe, { rimStrength: 0.2 })));
    gore.position.y = 2.2; g.add(gore);
  }
  const basket = shadowed(new THREE.Mesh(new THREE.BoxGeometry(0.42, 0.34, 0.42), clay(0xa8774a, { rimStrength: 0.1 })));
  basket.position.y = 0.17;
  g.add(basket);
  const lineMat = clay(0x6b5a48);
  for (const [x, z] of [[1, 1], [1, -1], [-1, 1], [-1, -1]]) {
    const a = new THREE.Vector3(x * 0.19, 0.34, z * 0.19), b = new THREE.Vector3(x * 0.2, 1.05, z * 0.2);
    const c = new THREE.Mesh(new THREE.CylinderGeometry(0.012, 0.012, a.distanceTo(b), 6), lineMat);
    c.position.copy(a).add(b).multiplyScalar(0.5);
    c.quaternion.setFromUnitVectors(UP, b.clone().sub(a).normalize());
    g.add(c);
  }
  scene.add(g);
  return g;
}
if (ACT === 4) {
  balloons = [makeBalloon(MINT, 0xf3efe6), makeBalloon(CORAL, 0xf3efe6)];
  ropeMat = clay(0x8a6a44, { rimStrength: 0.1 });
  // a few clay houses far behind for scale
  const r = rng(21);
  for (let i = 0; i < 7; i++) {
    const h = new THREE.Group();
    const b = shadowed(new THREE.Mesh(new THREE.BoxGeometry(1.1, 0.8, 0.9), clay(0xe9e3f4)));
    b.position.y = 0.4; h.add(b);
    const roof = shadowed(new THREE.Mesh(new THREE.ConeGeometry(0.85, 0.55, 4), clay([0x7c6fd6, 0xd99a2b, 0x9fb7e8][i % 3])));
    roof.position.y = 1.07; roof.rotation.y = Math.PI / 4; h.add(roof);
    h.position.set(-6 + i * 2.0 + r() * 0.5, 0, -6 - r() * 3);
    h.rotation.y = (r() - 0.5) * 0.6;
    scene.add(h);
  }
}
function actBalloons(t) {
  // A (green) lifts at 0.3 s and climbs; B (coral) stays on the grass until the rope is taut.
  const xa0 = -1.1, xb0 = 1.1;
  const climb = (s) => (s <= 0 ? 0 : 0.55 * s * s / (1 + 0.25 * s));       // gentle acceleration
  const ya = climb(t - 0.3) * 2.3;
  let xa = xa0 + 0.08 * Math.sin(t * 0.9), xb = xb0, yb = 0;
  const dx0 = xb0 - xa;
  if (ya > Math.sqrt(L * L - dx0 * dx0)) {
    // taut: B hangs at rope length below-and-beside A and swings in toward it
    const tt = clamp((ya - Math.sqrt(L * L - dx0 * dx0)) / 2.5);
    const dx = lerp(dx0, 1.3, easeInOutCubic(tt)) + 0.12 * Math.sin(t * 3.1) * (1 - tt) * tt * 4;
    xb = xa + dx;
    yb = ya - Math.sqrt(L * L - dx * dx);
  }
  balloons[0].position.set(xa, ya, 0);
  balloons[1].position.set(xb, yb, 0.3);
  balloons[0].rotation.z = 0.05 * Math.sin(t * 1.3);
  balloons[1].rotation.z = yb > 0 ? -0.06 * Math.sin(t * 2.0) : 0;
  // rope from basket A to basket B: a sagging curve while slack, straight when taut
  const a = new THREE.Vector3(xa + 0.21, ya + 0.12, 0), b = new THREE.Vector3(xb - 0.21, yb + 0.12, 0.3);
  const d = a.distanceTo(b), sag = Math.sqrt(Math.max(0, L * L - d * d)) * 0.5;
  const mid = a.clone().add(b).multiplyScalar(0.5);
  mid.y -= sag;
  if (mid.y < 0.02) mid.y = 0.02;          // a slack rope rests on the grass
  const curve = new THREE.QuadraticBezierCurve3(a, mid, b);
  if (rope) { rope.geometry.dispose(); scene.remove(rope); }
  rope = shadowed(new THREE.Mesh(new THREE.TubeGeometry(curve, 48, 0.025, 6, false), ropeMat));
  scene.add(rope);
  const look = (ya + Math.max(yb, 0)) / 2 + 1.4;
  camera.position.set(0.4 + 0.05 * Math.sin(t * 0.7), 1.6 + look * 0.55, 12.6 + look * 0.35);
  camera.lookAt(0, look, 0);
}

ready({ duration: DUR, renderAt(t) {
  if (ACT <= 2) actLine(t); else if (ACT === 3) actJar(t); else actBalloons(t);
  camera.updateMatrixWorld();
  draw(t);
} });
</script>
</body>
</html>
