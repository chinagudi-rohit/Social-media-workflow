<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Deductible acts</title>
<style>
  html, body { margin: 0; background: #f6f4fa; overflow: hidden; }
  #stage { position: absolute; inset: 0; }
  #stage canvas { display: block; }
</style>
<script type="importmap">
{ "imports": { "three": "/node_modules/three/build/three.module.js", "three/addons/": "/node_modules/three/examples/jsm/" } }
</script>
</head>
<body>
<div id="stage"></div>
<script type="module">
// Text-free clay clips for the car-insurance deductible Short (run 2026-10-18), one per
// replaced voice block (?act=1..3). Each shot is a hard camera cut at the times listed in CUTS
// so the assembler's scene-cut detection lands on them; render.json's clip_start values match.
//   act 1 (block 3, 10.6 s): two gauges on a post. Shot A: the left (deductible) needle steps up.
//        Shot B (5.1 s): close on the right (premium) gauge, its needle drops, the blank tag shrinks.
//   act 2 (blocks 5 + 6, 14.5 s): a blank desk calendar and a coin stack; each year fills a page's
//        12 month squares, flips it, and adds 4 coins. A: year one. B (3.1): a coral "risk" column
//        10 coins high. C (7.2): year two and a half year, the stack reaches the column, it turns
//        mint. D (10.8): the years keep coming and the stack keeps growing.
//   act 3 (block 7, 9.7 s): a glass jar with a blank band and coins resting inside, on a teal
//        shelf with clay houses and a car. Two camera angles (cut 5.0), nothing moves but the camera.
import * as THREE from "three";
import { makeRenderer, ready, span, clamp, lerp, easeOutBack, easeOutCubic, easeInOutCubic, rng, params,
  studioEnvironment, cameraRig, clay, studio } from "./kit.js";

const ACT = Number(params.get("act") || 1);
const CUTS = { 1: [5.1], 2: [3.1, 7.2, 10.8], 3: [5.0] }[ACT];
const DUR = { 1: 10.6, 2: 14.5, 3: 9.7 }[ACT];

const { renderer, scene, camera, draw } = makeRenderer({
  tone: "neutral", msaa: 4, shadows: "vsm", fov: 36,
  bloom: { strength: 0.5, radius: 0.45, threshold: 1.15 },
  finish: { grain: 0.03, vignette: 0.18, aberration: 0.0012 },
});
renderer.toneMappingExposure = 0.92;
studioEnvironment(renderer, scene, 0.4);
studio(scene);
scene.add(new THREE.HemisphereLight(0xffffff, 0xd9d2ea, 0.55));
const key = new THREE.DirectionalLight(0xfff1e0, 1.9);
key.position.set(5, 10, 7);
key.castShadow = true;
key.shadow.mapSize.set(1024, 1024);
key.shadow.radius = 7;
key.shadow.blurSamples = 10;
Object.assign(key.shadow.camera, { left: -9, right: 9, top: 9, bottom: -9, near: 1, far: 40 });
key.shadow.bias = -0.0005;
scene.add(key);
const fill = new THREE.DirectionalLight(0xcfe0ff, 0.6);
fill.position.set(-7, 4, 3);
scene.add(fill);

const GOLD = 0xd99a2b, CORAL = 0xf0473c, MINT = 0x2fa37a, INK = 0x2b2540, CREAM = 0xfbf6ec;
const shade = (m) => { m.castShadow = m.receiveShadow = true; return m; };
const mesh = (geo, mat, parent = scene) => { const m = shade(new THREE.Mesh(geo, mat)); parent.add(m); return m; };
const shotOf = (t) => { let k = 0; while (k < CUTS.length && t >= CUTS[k]) k++; return k; };
const shotStart = (k) => (k === 0 ? 0 : CUTS[k - 1]);

let update = () => {};
let rigs = [];

// ---------------------------------------------------------------- act 1: gauges
if (ACT === 1) {
  const post = new THREE.Group();
  scene.add(post);
  mesh(new THREE.CylinderGeometry(0.75, 0.85, 0.16, 48), clay(0xe4def2), post).position.y = 0.08;
  mesh(new THREE.CylinderGeometry(0.11, 0.13, 2.6, 32), clay(0xe4def2), post).position.y = 1.4;
  const bar = mesh(new THREE.BoxGeometry(2.6, 0.18, 0.22), clay(0xe4def2), post);
  bar.position.set(0, 2.75, 0);

  function gauge(x, bezel) {
    const g = new THREE.Group();
    g.position.set(x, 2.95, 0.2);
    scene.add(g);
    const body = mesh(new THREE.CylinderGeometry(0.86, 0.86, 0.32, 72), clay(bezel, { rimStrength: 0.2 }), g);
    body.rotation.x = Math.PI / 2;
    const face = mesh(new THREE.CylinderGeometry(0.72, 0.72, 0.04, 72), clay(CREAM, { rimStrength: 0.05 }), g);
    face.rotation.x = Math.PI / 2;
    face.position.z = 0.16;
    // Coloured zones (no numbers): mint on the low side, coral on the high side.
    const zone = (a0, a1, color) => {
      const m = mesh(new THREE.RingGeometry(0.5, 0.62, 48, 1, Math.PI / 2 - a1, a1 - a0), clay(color, { rimStrength: 0 }), g);
      m.position.z = 0.185;
    };
    const R = Math.PI / 180;
    zone(-115 * R, -40 * R, MINT);
    zone(-40 * R, 40 * R, 0xf2c14e);
    zone(40 * R, 115 * R, CORAL);
    for (let i = 0; i <= 10; i++) {
      const a = (-115 + i * 23) * R;
      const tick = mesh(new THREE.BoxGeometry(0.035, i % 5 === 0 ? 0.16 : 0.1, 0.02), clay(INK, { rimStrength: 0 }), g);
      tick.position.set(Math.sin(a) * 0.4, Math.cos(a) * 0.4, 0.19);
      tick.rotation.z = -a;
    }
    const needle = new THREE.Group();
    needle.position.z = 0.21;
    g.add(needle);
    const nShape = new THREE.Shape([new THREE.Vector2(-0.05, 0), new THREE.Vector2(0.05, 0), new THREE.Vector2(0.012, 0.6), new THREE.Vector2(-0.012, 0.6)]);
    const n = mesh(new THREE.ExtrudeGeometry(nShape, { depth: 0.03, bevelEnabled: false }), clay(INK, { rimStrength: 0.1 }), needle);
    n.position.y = -0.08;
    const hub = mesh(new THREE.CylinderGeometry(0.08, 0.08, 0.07, 32), clay(GOLD, { rimStrength: 0.15, roughness: 0.4 }), needle);
    hub.rotation.x = Math.PI / 2;
    hub.position.z = 0.03;
    return { g, needle };
  }
  const left = gauge(-1.05, 0x2a9d8f);    // deductible
  const right = gauge(1.05, 0x7c6fd6);    // premium

  // A blank price tag hanging from the premium gauge on a string.
  const tagPivot = new THREE.Group();
  tagPivot.position.set(1.05, 2.1, 0.25);
  scene.add(tagPivot);
  const str = mesh(new THREE.CylinderGeometry(0.012, 0.012, 0.42, 8), clay(0x8a7f9e, { rimStrength: 0 }), tagPivot);
  str.position.y = -0.21;
  const tagShape = new THREE.Shape();
  const tw = 0.3, th = 0.78, cut = 0.14;
  tagShape.moveTo(-tw, -th); tagShape.lineTo(tw, -th); tagShape.lineTo(tw, -cut); tagShape.lineTo(0.0, 0.0);
  tagShape.lineTo(-tw, -cut); tagShape.closePath();
  const hole = new THREE.Path(); hole.absarc(0, -0.13, 0.045, 0, Math.PI * 2, true); tagShape.holes.push(hole);
  const tagGeo = new THREE.ExtrudeGeometry(tagShape, { depth: 0.04, bevelEnabled: true, bevelThickness: 0.015, bevelSize: 0.015, bevelSegments: 2 });
  tagGeo.translate(0, 0, -0.02);
  const tag = mesh(tagGeo, clay(0xf2c14e, { rimStrength: 0.15 }), tagPivot);
  tag.position.y = -0.36;

  const R = Math.PI / 180;
  const setNeedle = (nd, deg) => { nd.needle.rotation.z = -deg * R; };
  rigs = [
    cameraRig([{ t: 0, pos: [0, 2.4, 14.0], look: [0, 2.2, 0] }, { t: 5.1, pos: [0.15, 2.5, 12.6], look: [0, 2.3, 0] }], { drift: 0.03 }),
    cameraRig([{ t: 0, pos: [1.9, 2.8, 6.6], look: [1.05, 2.35, 0] }, { t: 5.5, pos: [1.65, 2.7, 5.8], look: [1.05, 2.35, 0] }], { drift: 0.03 }),
  ];
  update = (t) => {
    // Deductible: two steps up ($500, then $1,000) with a little overshoot.
    const l = lerp(-95, -20, span(t, 0.9, 1.5, easeOutBack)) + 100 * span(t, 2.4, 3.1, easeOutBack);
    setNeedle(left, l);
    // Premium: high, then it drops in shot B.
    const r = lerp(75, -60, span(t, 5.9, 7.2, easeOutBack)) + Math.sin(t * 9.0) * 1.2 * (1 - span(t, 5.9, 6.4));
    setNeedle(right, r);
    const s = lerp(1, 0.55, span(t, 5.95, 7.25, easeInOutCubic));
    tagPivot.scale.setScalar(s);
    tagPivot.rotation.z = Math.sin(t * 1.6) * 0.07;
    tagPivot.rotation.y = Math.sin(t * 1.1 + 1.0) * 0.12;
  };
}

// ---------------------------------------------------------------- act 2: calendar + coins
if (ACT === 2) {
  // Years elapsed as keyframes [t, Y]; a page fills its 12 month squares as a year passes,
  // flips when the year is done, and every quarter year one coin lands on the stack.
  const YK = [[0, 0], [0.4, 0], [1.4, 1], [7.2, 1], [7.6, 2], [7.95, 2], [8.45, 2.5], [11.0, 2.5], [11.6, 3],
    [12.3, 4], [13.0, 5], [13.7, 6], [14.5, 7]];
  const Yat = (t) => {
    if (t <= YK[0][0]) return YK[0][1];
    for (let i = 1; i < YK.length; i++) if (t <= YK[i][0]) {
      const [t0, y0] = YK[i - 1], [t1, y1] = YK[i];
      return y0 + (y1 - y0) * (t - t0) / (t1 - t0);
    }
    return YK[YK.length - 1][1];
  };
  const tAt = (y) => {   // first time Y reaches y
    for (let i = 1; i < YK.length; i++) {
      const [t0, y0] = YK[i - 1], [t1, y1] = YK[i];
      if (y1 >= y - 1e-6 && y1 > y0) return t0 + (t1 - t0) * clamp((y - y0) / (y1 - y0));
    }
    return 1e9;
  };

  // Desk calendar on an easel at x = -1.05, pages hinged at the top ring.
  const CAL = new THREE.Group();
  CAL.position.set(-0.95, 0, 0);
  CAL.rotation.y = 0.18;
  scene.add(CAL);
  const easel = new THREE.Group();     // the back board of the tent, leaning the other way
  easel.position.set(0, 2.0, -0.02);
  easel.rotation.x = 0.3;
  CAL.add(easel);
  mesh(new THREE.BoxGeometry(1.46, 2.12, 0.05), clay(0x7c6fd6, { rimStrength: 0.15 }), easel).position.y = -1.06;
  const hinge = new THREE.Group();
  hinge.position.set(0, 2.0, 0.02);
  hinge.rotation.x = -0.24;            // the pages lean back against the easel
  CAL.add(hinge);
  const ring = mesh(new THREE.CylinderGeometry(0.035, 0.035, 1.5, 16), clay(0xb8b0c8, { rimStrength: 0.1, roughness: 0.35 }), hinge);
  ring.rotation.z = Math.PI / 2;
  const PAGES = 9, PW = 1.36, PH = 1.86;
  const pages = [];
  const sqGeo = new THREE.BoxGeometry(0.3, 0.26, 0.006);
  const off = new THREE.Color(0xd8d1e4), on = new THREE.Color(MINT);
  for (let k = 0; k < PAGES; k++) {
    const p = new THREE.Group();
    p.position.z = -k * 0.012;
    hinge.add(p);
    const sheet = mesh(new THREE.BoxGeometry(PW, PH, 0.008), clay(0xf1ece2, { rimStrength: 0.04 }), p);
    sheet.position.y = -PH / 2 - 0.04;
    const head = mesh(new THREE.BoxGeometry(PW, 0.34, 0.012), clay(CORAL, { rimStrength: 0.1 }), p);
    head.position.set(0, -0.04 - 0.17, 0.006);
    const squares = [];
    for (let i = 0; i < 12; i++) {
      const m = new THREE.Mesh(sqGeo, new THREE.MeshStandardMaterial({ color: off.clone(), roughness: 0.8 }));
      m.position.set(-0.4 + (i % 3) * 0.4, -0.62 - Math.floor(i / 3) * 0.33, 0.008);
      m.receiveShadow = true;
      p.add(m);
      squares.push(m);
    }
    pages.push({ p, squares });
  }

  // Coin stack on a plate at x = 1.0, plus the "risk" column of 10 coins.
  const PX = 0.95, COIN_H = 0.12, CR = 0.42;
  mesh(new THREE.CylinderGeometry(0.62, 0.66, 0.08, 64), clay(0xe4def2, { rimStrength: 0.1 }), scene).position.set(PX, 0.04, 0);
  const coinGeo = new THREE.CylinderGeometry(CR, CR, COIN_H * 0.9, 56);
  const coins = new THREE.InstancedMesh(coinGeo, clay(GOLD, { rimStrength: 0.12, roughness: 0.4 }), 40);
  shade(coins);
  coins.frustumCulled = false;   // instances move far from where the bounds were first computed
  scene.add(coins);
  const tone = rng(5), col = new THREE.Color();
  for (let i = 0; i < 40; i++) coins.setColorAt(i, col.setScalar(0.9 + tone() * 0.14));
  const jit = rng(11);
  const J = Array.from({ length: 40 }, () => [(jit() - 0.5) * 0.04, (jit() - 0.5) * 0.04, jit() * 6.28]);
  const ghostMat = new THREE.MeshPhysicalMaterial({ color: CORAL, transparent: true, opacity: 0.22, roughness: 0.3, depthWrite: false });
  const ghost = new THREE.Mesh(new THREE.CylinderGeometry(0.56, 0.56, 1, 64, 1, true), ghostMat);
  scene.add(ghost);
  const capMat = clay(CORAL, { rimStrength: 0.2 });
  const cap = mesh(new THREE.TorusGeometry(0.58, 0.035, 16, 72), capMat);
  cap.rotation.x = Math.PI / 2;
  const M = new THREE.Matrix4(), Q = new THREE.Quaternion(), P = new THREE.Vector3(), S = new THREE.Vector3(), UP = new THREE.Vector3(0, 1, 0);
  const coral = new THREE.Color(CORAL), mint = new THREE.Color(MINT);

  rigs = [
    cameraRig([{ t: 0, pos: [0, 2.4, 11.2], look: [0, 1.05, 0] }, { t: 3.1, pos: [0.15, 2.2, 10.2], look: [0, 1.05, 0] }], { drift: 0.03 }),
    cameraRig([{ t: 0, pos: [2.5, 1.6, 4.9], look: [1.0, 0.75, 0] }, { t: 4.1, pos: [2.2, 1.75, 4.3], look: [1.0, 0.8, 0] }], { drift: 0.03 }),
    cameraRig([{ t: 0, pos: [-2.2, 2.0, 7.4], look: [0.0, 1.0, 0] }, { t: 3.6, pos: [-1.8, 2.1, 6.7], look: [0.05, 1.0, 0] }], { drift: 0.03 }),
    cameraRig([{ t: 0, pos: [1.9, 1.9, 7.6], look: [0.4, 1.3, 0] }, { t: 3.7, pos: [1.6, 3.4, 8.6], look: [0.4, 2.1, 0] }], { drift: 0.03 }),
  ];
  update = (t) => {
    const Y = Yat(t);
    pages.forEach(({ p, squares }, k) => {
      const filled = clamp(Y - k) * 12;
      squares.forEach((m, i) => m.material.color.copy(off).lerp(on, clamp(filled - i)));
      const flipT = tAt(k + 1);       // the page goes over the top once its year is done
      const f = span(t, flipT, flipT + 0.38, easeInOutCubic);
      p.rotation.x = -f * 5.62;        // up towards the camera, over the ring, down the back
    });
    for (let i = 0; i < 40; i++) {
      const land = tAt((i + 1) / 4);
      const k = clamp((t - (land - 0.28)) / 0.28);
      if (k <= 0) { coins.setMatrixAt(i, M.makeScale(1e-4, 1e-4, 1e-4)); continue; }
      P.set(PX + J[i][0], 0.08 + COIN_H * (i + 0.5) + (1 - easeOutBack(k)) * 0.9, J[i][1]);
      Q.setFromAxisAngle(UP, J[i][2]);
      coins.setMatrixAt(i, M.compose(P, Q, S.setScalar(1)));
    }
    coins.instanceMatrix.needsUpdate = true;
    const g = span(t, 3.3, 4.1, easeOutCubic), hgt = 10 * COIN_H;
    ghost.visible = cap.visible = g > 0.001;
    ghost.scale.set(1, Math.max(1e-3, hgt * g), 1);
    ghost.position.set(PX, 0.08 + hgt * g / 2, 0);
    cap.position.set(PX, 0.08 + hgt * g, 0);
    const ok = span(t, 8.5, 8.9);
    ghostMat.color.copy(coral).lerp(mint, ok);
    capMat.color.copy(coral).lerp(mint, ok);
    ghostMat.opacity = 0.22 * (1 - 0.5 * span(t, 11.0, 12.0));
  };
}

// ---------------------------------------------------------------- act 3: savings jar
if (ACT === 3) {
  const shelf = mesh(new THREE.BoxGeometry(7.0, 0.24, 2.6), clay(0x2a9d8f, { rimStrength: 0.12 }));
  shelf.position.set(0, 0.12, -0.3);
  const TOP = 0.24;
  // Glass jar (lathe), cork lid, blank paper band.
  const prof = [[0.0, 0.0], [0.62, 0.0], [0.72, 0.06], [0.75, 0.2], [0.75, 1.35], [0.66, 1.52], [0.56, 1.6], [0.56, 1.72]]
    .map(([r, y]) => new THREE.Vector2(r, y));
  const glass = new THREE.MeshPhysicalMaterial({ color: 0xe6f4f1, roughness: 0.04, metalness: 0, transparent: true, opacity: 0.2,
    clearcoat: 1, clearcoatRoughness: 0.05, side: THREE.DoubleSide, depthWrite: false, envMapIntensity: 1.6 });
  const jar = new THREE.Mesh(new THREE.LatheGeometry(prof, 72), glass);
  jar.position.y = TOP;
  jar.renderOrder = 2;
  scene.add(jar);
  const lid = mesh(new THREE.CylinderGeometry(0.6, 0.57, 0.3, 64), clay(0xc89b6d, { rimStrength: 0.12, roughness: 0.85 }));
  lid.position.y = TOP + 1.72 + 0.12;
  const band = new THREE.Mesh(new THREE.CylinderGeometry(0.765, 0.765, 0.5, 72, 1, true), clay(0xf6efe0, { rimStrength: 0.06 }));
  band.material.side = THREE.DoubleSide;
  band.position.y = TOP + 0.85;
  band.castShadow = true;
  scene.add(band);
  // Coins resting inside: two short stacks and a few lying flat.
  const coinGeo = new THREE.CylinderGeometry(0.22, 0.22, 0.055, 48);
  const cm = clay(GOLD, { rimStrength: 0.12, roughness: 0.4 });
  const r = rng(21);
  const place = (x, z, n, tilt = 0) => {
    for (let i = 0; i < n; i++) {
      const c = mesh(coinGeo, cm);
      c.position.set(x + (r() - 0.5) * 0.03, TOP + 0.03 + 0.06 * i + 0.03, z + (r() - 0.5) * 0.03);
      c.rotation.set(tilt * (i === n - 1 ? 1 : 0), r() * 6, 0);
    }
  };
  place(-0.22, 0.12, 5); place(0.25, -0.05, 3); place(0.05, -0.32, 2); place(0.3, 0.32, 1, 0.12); place(-0.3, -0.28, 1);
  // Background: small clay houses and a car on the shelf.
  function house(x, z, s, roofCol) {
    const h = new THREE.Group(); h.position.set(x, TOP, z); h.scale.setScalar(s); scene.add(h);
    mesh(new THREE.BoxGeometry(1.0, 0.7, 0.8), clay(0xe9e3f4, { rimStrength: 0.1 }), h).position.y = 0.35;
    const gable = new THREE.Shape([new THREE.Vector2(-0.6, 0), new THREE.Vector2(0.6, 0), new THREE.Vector2(0, 0.45)]);
    const rg = new THREE.ExtrudeGeometry(gable, { depth: 0.9, bevelEnabled: false }); rg.translate(0, 0, -0.45);
    mesh(rg, clay(roofCol, { rimStrength: 0.15 }), h).position.y = 0.7;
    mesh(new THREE.BoxGeometry(0.2, 0.36, 0.03), clay(GOLD), h).position.set(0, 0.18, 0.41);
    return h;
  }
  house(-2.1, -0.9, 0.95, 0x7c6fd6).rotation.y = 0.35;
  house(2.2, -1.0, 0.85, CORAL).rotation.y = -0.4;
  const car = new THREE.Group(); car.position.set(1.55, TOP, 0.45); car.rotation.y = -0.6; scene.add(car);
  mesh(new THREE.BoxGeometry(0.9, 0.24, 0.44), clay(0xf2c14e, { rimStrength: 0.15 }), car).position.y = 0.2;
  mesh(new THREE.BoxGeometry(0.5, 0.2, 0.4), clay(0xf2c14e, { rimStrength: 0.15 }), car).position.set(-0.05, 0.4, 0);
  for (const [x, z] of [[-0.28, 0.22], [0.28, 0.22], [-0.28, -0.22], [0.28, -0.22]]) {
    const w = mesh(new THREE.CylinderGeometry(0.1, 0.1, 0.08, 24), clay(INK, { rimStrength: 0.05 }), car);
    w.rotation.x = Math.PI / 2; w.position.set(x, 0.1, z);
  }
  rigs = [
    cameraRig([{ t: 0, pos: [0, 1.9, 8.2], look: [0, 1.15, 0] }, { t: 5.0, pos: [0, 1.75, 6.4], look: [0, 1.1, 0] }], { drift: 0.03 }),
    cameraRig([{ t: 0, pos: [2.3, 1.5, 4.7], look: [0.0, 1.1, 0] }, { t: 4.7, pos: [1.95, 1.45, 4.1], look: [0.0, 1.1, 0] }], { drift: 0.02 }),
  ];
}

ready({
  duration: DUR,
  renderAt(t) {
    update(t);
    const k = shotOf(t);
    rigs[Math.min(k, rigs.length - 1)](camera, t - shotStart(k));
    camera.updateMatrixWorld();
    draw(t);
  },
});
</script>
</body>
</html>
